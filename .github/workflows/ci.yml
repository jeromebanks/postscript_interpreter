# Build/test/lint gate for every push to main and every pull request —
# the automated half of AGENTS.md's quality bar (`cargo build && cargo
# test && cargo clippy --all-targets && cargo fmt --check`), so a PR
# can't land without it passing.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test
