# Build/test/lint gate for every push to main and every pull request —
# the automated half of AGENTS.md's quality bar (`scripts/selftest.sh`,
# `cargo test --profile ci`, `cargo clippy --all-targets -- -D warnings`,
# `cargo fmt --all -- --check`), so a PR can't land without it passing.
#
# The test step's real pass/fail counts and failure output are also
# posted as a PR comment (and echoed to the linked issue) via
# scripts/ci_test_summary.sh — not just the green/red `test` status
# check — so a PR carries evidence tests actually ran, not just a
# self-reported checkbox (issue #24). Comments only happen on
# `pull_request` runs, where GITHUB_TOKEN gets write access from
# workflow-level `permissions:` below; PRs from forks still get a
# read-only token regardless (a GitHub Actions security default, not
# something to work around here), so the comment step silently no-ops
# for those. The job summary always gets the same content via
# $GITHUB_STEP_SUMMARY, fork PRs included.
#
# The perf-regression job (issue #25) runs benches/regression.rs,
# comparing a HEAD-built `pscat` binary against one built from the
# PR's merge base *on the same runner, in the same job* — same-job A/B
# rather than a stored cross-run baseline, so runner-to-runner
# hardware/thermal noise cancels out instead of contaminating the
# comparison. It posts the same way the test summary does. It is
# deliberately NOT in `required_status_checks` below (see SDLC.md) —
# a red ❌ here is a strong signal, not an enforced merge block; see
# docs/archive/NOTES.md for why and the follow-up issue tracking promoting it.
#
# Both jobs post via scripts/gh_comment_upsert.sh (a marker-based
# find-or-create/update), not `gh pr comment --edit-last`: `--edit-last`
# scopes to the authenticated user's *most recent* comment with no
# content awareness, so two jobs both posting as github-actions[bot]
# would clobber each other's comment on every run instead of each
# keeping its own updated in place.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

# Pull requests: a commit pushed while a prior run for the same PR is still
# going (or a manual rerun of an old commit) must not let the older run
# finish last and overwrite newer test evidence on the PR/issue comment via
# the upsert script — cancel the superseded run instead of racing it. That
# is the only reason to cancel, and only `pull_request` runs post comments.
#
# Pushes to main: never cancel. Several agents merge to main in quick
# succession, and cancelling each push run on the next merge left merge
# commits with no completed result (#273). Pushes post no comments, so
# nothing can race. The group key is the commit SHA for push events (a
# shared `main` group would still let GitHub drop a *pending* run when a
# newer one queues, even with cancel-in-progress off), so every merge
# commit gets its own group and its own completed run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        # Explicit `bash` (vs. the implicit default shell) runs with
        # `-o pipefail`, so `cargo test | tee` below reports cargo test's
        # real exit status instead of tee's — without this, a failing
        # test run still shows steps.test.outcome == 'success' and both
        # the required check and the "Fail job if tests failed" step
        # below silently miss it.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # No separate `cargo build`: clippy type-checks every target, and the
      # selftest and test steps below build (and link) every binary, so a
      # debug build here would only be a second, slow compile of the same
      # code (issue #204).

      # The PS-native verification pass (issue #95): every library's
      # %%SelfTest blocks, then strict lint over every rendering
      # driver. Its own step rather than folded into `cargo test` so a
      # PS-only failure reads as one on the run page — tests/selftest.rs
      # runs the same checks under `cargo test` below regardless, since
      # that's what the required status check actually gates on.
      #
      # Both this step and `cargo test` use the `ci` profile (Cargo.toml):
      # optimized like release, with debug-assertions and overflow-checks
      # kept on. Most of the suite runs PostScript through the interpreter,
      # which is ~14x slower unoptimized (issue #204: 849s debug).
      - name: PS-native self-checks
        env:
          PSCAT_PROFILE: ci
        run: ./scripts/selftest.sh

      - name: Run tests
        id: test
        continue-on-error: true
        run: cargo test --profile ci 2>&1 | tee test-output.log

      - name: Summarize test results
        if: "!cancelled()"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/ci_test_summary.sh test-output.log "${{ steps.test.outcome }}" "$RUN_URL" \
            | tee test-summary.md >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error: a comment-posting failure (fork PR read-only
      # token, transient API error) must not flip the required `test`
      # check red on a run where the actual tests passed — the job
      # summary above already carries the same content as a fallback.
      - name: Comment on PR
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/gh_comment_upsert.sh '<!-- ci-test-summary -->' \
            "${{ github.event.pull_request.number }}" test-summary.md

      - name: Comment on linked issue
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(printf '%s' "$PR_BODY" \
            | grep -Eio '(Closes|Fixes|Resolves) #[0-9]+' | grep -Eo '[0-9]+' | head -1 || true)
          if [ -n "$issue" ]; then
            ./scripts/gh_comment_upsert.sh '<!-- ci-test-summary -->' "$issue" test-summary.md
          fi

      - name: Fail job if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  perf-regression:
    # Only meaningful on a PR — the comparison is HEAD vs. the PR's
    # merge base, and a bare push to main has no "base" to diff.
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        # head/ is checked out below; everything past that checkout
        # step runs with head/ as cwd by default (workload .ps files
        # and scripts/gh_comment_upsert.sh both need to resolve
        # against HEAD's checkout, not the job root).
        working-directory: head
    steps:
      - name: Check out HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: head
      - name: Check out merge base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            head -> target
            base -> target

      - name: Build HEAD pscat binary (release)
        run: cargo build --release --bin pscat
      - name: Build base pscat binary (release)
        working-directory: base
        run: cargo build --release --bin pscat

      # benches/regression.rs only exists on HEAD (it's what this PR
      # adds) — it is compiled from the head/ checkout and pointed at
      # both prebuilt binaries by path, rather than each side running
      # its own copy of the harness. This also means workload .ps
      # files always come from HEAD for both sides: a PR that only
      # edits a gallery file can't masquerade as an interpreter
      # regression.
      - name: Run perf/memory regression check
        id: perf
        continue-on-error: true
        run: |
          cargo bench --bench regression -- \
            --head "$GITHUB_WORKSPACE/head/target/release/pscat" \
            --base "$GITHUB_WORKSPACE/base/target/release/pscat" \
            --runs 5 > perf-summary.md

      - name: Post job summary
        if: "!cancelled()"
        run: cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error: same reasoning as the test job's comment
      # steps — a comment-posting failure must not obscure the actual
      # perf result, which the job summary above already carries.
      - name: Comment on PR
        if: "!cancelled()"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/gh_comment_upsert.sh '<!-- perf-regression -->' \
            "${{ github.event.pull_request.number }}" perf-summary.md

      - name: Comment on linked issue
        if: "!cancelled()"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(printf '%s' "$PR_BODY" \
            | grep -Eio '(Closes|Fixes|Resolves) #[0-9]+' | grep -Eo '[0-9]+' | head -1 || true)
          if [ -n "$issue" ]; then
            ./scripts/gh_comment_upsert.sh '<!-- perf-regression -->' "$issue" perf-summary.md
          fi

      # Not in required_status_checks (SDLC.md) — see the module
      # comment at the top of this file — but the job itself still
      # goes red on a >=FAIL_PCT regression so it's a visible signal.
      - name: Fail job if regression check failed
        if: steps.perf.outcome == 'failure'
        run: exit 1

  # Issue #598: pscat installed with `cargo install`, run with a clean
  # HOME/CARGO_HOME from a directory outside the checkout, must render
  # its mathkit/drychalk/typewriter examples from the lib/ embedded in
  # the binary (the script asserts on the resolver trace). Its own job,
  # not in required_status_checks yet; #601 extends the OS matrix.
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows (#601): check out LF files, as in cross-platform below.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
      - name: Clean install and render outside the checkout
        run: ./scripts/clean_install_test.sh

  # ---------------------------------------------------------------------------
  # Cross-platform, MSRV, packaging and licence checks (issue #601, release
  # epic #562). Everything below is additive and independent of the `test` job
  # above, which stays exactly as it was: it is the one required status check
  # (SDLC.md), so a matrix on it would rename it to `test (macos-latest)` and
  # leave the required `test` check pending forever. These jobs report as their
  # own checks; the owner decides which become required (see the PR for names).
  # ---------------------------------------------------------------------------

  # The same build/test pass on Linux and Windows. No PR comments here (the
  # `test` job owns that), just the pass/fail. Performance is not the point:
  # tests/common's CPU-time budgets are generous, and a miss on a slow runner
  # is read as noise, not a finding.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Windows checkouts default to core.autocrlf=true, which turns every
      # tracked text file (lib/*.ps, test fixtures, goldens) into CRLF. The
      # repo is LF everywhere, so check it out as it is.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: PS-native self-checks
        env:
          PSCAT_PROFILE: ci
        run: ./scripts/selftest.sh
      # --no-fail-fast: one failing test binary must not hide the rest on a
      # platform where nothing has run before.
      - name: Run tests
        run: cargo test --profile ci --no-fail-fast

  # The declared minimum supported Rust version (`rust-version` in Cargo.toml,
  # issue #563) really builds the crate, tests included. Read from Cargo.toml
  # so bumping it there is the only edit.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all-targets --locked

  # `cargo package --list` against the licence allowlist, and a publish dry
  # run, on PRs that touch what ends up in the crate. A bare push to main
  # always runs it. The job always reports (green when skipped) so it could be
  # made required without blocking unrelated PRs.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Does this change touch packaging?
        id: touch
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq \
            '^(Cargo\.toml|Cargo\.lock|build\.rs|deny\.toml|lib/|fonts/|LICENSE|THIRD_PARTY_NOTICES\.md|licenses/|scripts/check_licences\.py|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No packaging paths changed; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
        if: steps.touch.outputs.run == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.touch.outputs.run == 'true'
      - name: Package file list matches the licence allowlist
        if: steps.touch.outputs.run == 'true'
        run: python3 scripts/check_licences.py package
      # The publish dry run moved to the `crate` job below (issue #565), which
      # runs it from the unpacked .crate rather than the checkout.

  # The crates.io acceptance checks (issue #565), on every OS: the library and
  # CLI without the default `window` feature (clippy and the full test suite),
  # then scripts/check_package.sh against the packaged crate: size under
  # 10 MB, `cargo publish --dry-run` from the unpacked .crate, a downstream
  # `default-features = false` project with no winit/softbuffer in its graph
  # that renders PS to PNG through the documented API, and `cargo install` of
  # the packaged tree with the default features. Not path-filtered: a change
  # anywhere in src/ can break the headless build. Not required yet; the owner
  # decides (SDLC.md).
  crate:
    name: crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Tests without default features
        run: cargo test --profile ci --no-default-features --no-fail-fast
      - name: Package, publish dry run, downstream build, install
        run: ./scripts/check_package.sh

  # rustdoc as docs.rs runs it (Cargo.toml's [package.metadata.docs.rs]:
  # no default features, `--cfg docsrs`), with warnings as errors, so a broken
  # intra-doc link fails here and not on docs.rs after a publish. The
  # doctests themselves run in the `test` job.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rustdoc with the docs.rs flags
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --no-deps --no-default-features
      - name: rustdoc with the default features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  # cargo-semver-checks (issue #565): the supported library API (Interp, Page,
  # PsError; everything #[doc(hidden)] is out of scope) compared with the PR's
  # base commit. Informational, never red: the step has continue-on-error and
  # its findings go to the job summary. Why not a gate yet:
  #   - pscat is not on crates.io, so there is no published baseline; the
  #     base commit stands in for one.
  #   - the version in Cargo.toml is bumped at release time, not per PR, so
  #     any intentional API change would fail a blocking check until then.
  #     Pre-1.0 a minor bump may break the API; the release (#602) is where
  #     the version is chosen, and this summary is the input to that choice.
  # Once 0.6.0 is published, the release workflow can run it blocking against
  # the crates.io baseline with the version being released.
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-semver-checks
      - name: Public API against the PR base
        id: semver
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          cargo semver-checks check-release --baseline-rev "$BASE_SHA" 2>&1 | tee semver.log
      - name: Job summary
        if: "!cancelled()"
        env:
          OUTCOME: ${{ steps.semver.outcome }}
        run: |
          {
            echo "## cargo-semver-checks against the PR base (informational)"
            echo
            if [ "$OUTCOME" = success ]; then
              echo "No semver-relevant change to the supported API."
            else
              echo "Changes to the supported API that need a minor version bump"
              echo "(pre-1.0) at the next release, or a tool failure:"
            fi
            echo
            echo '```'
            tail -n 200 semver.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Licence policy that needs no Rust build: every font directory carries a
  # licence file, licenses/assets.json still describes the tracked assets, and
  # the checker's own tests pass.
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checker tests
        run: python3 scripts/test_check_licences.py
      - name: Font catalog and asset manifest
        run: python3 scripts/check_licences.py all

  # The release pipeline's own checks (issue #602), no Rust build: the
  # workflow policy (actions pinned to SHAs; OIDC tokens and secrets only in
  # the protected `release` environment, so PR CI cannot obtain publishing
  # credentials), the stage engine's publish/resume/halt tests against fake
  # registries, and scripts/release.sh in a scratch clone (needs git-cliff
  # and the full history for the changelog).
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: git-cliff
      - name: Workflow policy
        run: |
          python3 scripts/check_workflows.py
          python3 scripts/test_check_workflows.py
      - name: Release stages and release.sh
        run: python3 scripts/test_release_stages.py

  # Dependency licences and security advisories (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans sources
