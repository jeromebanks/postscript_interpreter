# Publish the pscat site (Stage 17) to GitHub Pages on every push to
# main. Needs Pages enabled with "GitHub Actions" as the source in
# the repo settings (Settings → Pages → Build and deployment).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Per job (issue #602): only the deploy job, in the github-pages
# environment, may mint an OIDC token (scripts/check_workflows.py).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: ./scripts/build_site.sh
      # A broken link blocks the deploy (#250); site-check.yml runs the same
      # check on pull requests.
      - run: python3 scripts/check_site_links.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
