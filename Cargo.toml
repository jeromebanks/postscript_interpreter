[package]
name = "pscat"
version = "0.5.0"
edition = "2024"
description = "A PostScript interpreter for watching programs draw, live"

[[bin]]
name = "pscat-mcp"
path = "src/bin/pscat_mcp.rs"

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "vs_gs"
harness = false

[dependencies]
serde_json = "1"
softbuffer = "0.4.8"
thiserror = "2"
flate2 = "1"
tiny-skia = "0.12.0"
ttf-parser = "0.25"
winit = "0.30.13"
zune-jpeg = "0.5.15"
