[package]
name = "pscat"
version = "0.5.1"
edition = "2024"
description = "A PostScript interpreter for watching programs draw, live"

[lib]
# cdylib is the wasm32 build (scripts/build_wasm.sh); rlib is everything else.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pscat-mcp"
path = "src/bin/pscat_mcp.rs"

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "vs_gs"
harness = false

[[bench]]
name = "regression"
harness = false

[dependencies]
serde_json = "1"
thiserror = "2"
flate2 = "1"
tiny-skia = "0.12.0"
ttf-parser = "0.25"
zune-jpeg = "0.5.15"

# The live window is desktop-only; the wasm32 build (Stage 16) ships
# the interpreter core and paints into a <canvas> instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
softbuffer = "0.4.8"
winit = "0.30.13"
